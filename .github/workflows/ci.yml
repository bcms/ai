name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate-release:
    name: Release validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # No npm install needed: the release tooling and the CLI tests are
      # dependency-free (the CLI's @thebcms/client is mocked in tests).
      - name: Release gate (versions, references, packages, artifacts, secrets, CLI tests)
        run: npm run validate:release
